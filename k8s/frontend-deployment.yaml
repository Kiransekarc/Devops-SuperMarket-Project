apiVersion: apps/v1
kind: Deployment
metadata:
  name: supermarket-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supermarket-frontend
  template:
    metadata:
      labels:
        app: supermarket-frontend
    spec:
      containers:
      - name: frontend
        image: supermarket-pipeline-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: supermarket-frontend
spec:
  selector:
    app: supermarket-frontend
  ports:
  - port: 3000
    targetPort: 3000
  type: NodePort
