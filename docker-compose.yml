version: '3.8'

services:
  backend:
    build: ./backend
    container_name: supermarket-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb+srv://admin:admin123@supermarketcluster.0cdcsoq.mongodb.net/supermarketDB?retryWrites=true&w=majority&appName=SuperMarketCluster
      - JWT_SECRET=your_super_secret_jwt_key_here_change_in_production
      - PORT=5000

  frontend:
    build: ./frontend
    container_name: supermarket-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
