version: '3.8'

services:
  backend:
    build: ./backend
    container_name: supermarket-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/supermarketDB
      - JWT_SECRET=your_super_secret_jwt_key_here_change_in_production
      - PORT=5000

  frontend:
    build: ./frontend
    container_name: supermarket-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
